[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "failure-memory"
version = "0.7.0"
description = "Local-first failure qualification, durable lessons, and recall for AI agents"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Failure Memory contributors" }]
keywords = [
  "agents",
  "failure-learning",
  "local-first",
  "mcp",
  "memory",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CongBao/failure-memory"
Issues = "https://github.com/CongBao/failure-memory/issues"
Repository = "https://github.com/CongBao/failure-memory.git"

[project.optional-dependencies]
retrieval-sqlite = [
  "fastembed==0.8.0",
  "sqlite-vec==0.1.9",
  "truststore==0.10.4",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "PyYAML>=6,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "jsonschema[format]>=4.25,<5",
  "ruff>=0.11,<1",
  "sqlite-vec==0.1.9",
]

[project.scripts]
failure-memory = "failure_memory.cli.main:main"
failure-memory-mcp = "failure_memory.bootstrap.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/failure_memory"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["failure_memory"]
mypy_path = "src"
